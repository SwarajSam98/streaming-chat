<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaming LLM Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #eaf0f9; background: #0b1220; }
    .shell { max-width: 1050px; margin: 0 auto; padding: 28px 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -.03em; }
    .sub { margin: 0; font-size: .91rem; color: #91a4bc; }
    .tag { display: inline-flex; align-items: center; gap: 8px; color: #b8cde4; font-size: .8rem; padding: 9px 12px; background: #172439; border-radius: 100px; }
    .dot { height: 8px; width: 8px; border-radius: 50%; background: #6ddbaf; }
    .layout { display: grid; grid-template-columns: 255px 1fr; gap: 16px; }
    aside, main { border: 1px solid #24344b; border-radius: 15px; background: #101b2b; }
    aside { padding: 20px; align-self: start; }
    label { display: block; font-size: .81rem; font-weight: 650; color: #b7c7db; margin: 0 0 8px; }
    input, textarea { width: 100%; border-radius: 9px; background: #0c1523; border: 1px solid #34465d; color: #eaf0f9; padding: 10px 12px; font: inherit; outline-offset: 2px; }
    input:focus, textarea:focus { outline: 2px solid #508de4; }
    aside textarea { resize: vertical; min-height: 96px; }
    .field { margin-bottom: 18px; }
    .help { margin: 6px 0 0; color: #879bb3; font-size: .73rem; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    button { border: 0; border-radius: 9px; background: #488bea; color: #fff; padding: 11px 15px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #263a53; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    main { display: flex; flex-direction: column; min-height: 550px; overflow: hidden; }
    .session { border-bottom: 1px solid #24344b; padding: 13px 19px; color: #93a8c1; font-size: .76rem; overflow-wrap: anywhere; }
    #messages { flex: 1; padding: 23px 20px; max-height: 60vh; min-height: 350px; overflow-y: auto; }
    .bubble { max-width: 90%; border-radius: 12px; padding: 12px 15px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; margin: 0 0 15px; font-size: .94rem; }
    .bubble.user { margin-left: auto; background: #244d85; }
    .bubble.assistant { background: #1c2a3d; }
    .empty { color: #92a5bd; text-align: center; padding-top: 80px; }
    .status { padding: 0 20px 9px; color: #91a4bc; min-height: 22px; font-size: .77rem; }
    .status.error { color: #ffb0b0; }
    form { display: flex; align-items: end; gap: 9px; padding: 15px 18px 20px; border-top: 1px solid #24344b; }
    form textarea { resize: none; min-height: 52px; max-height: 190px; }
    .composer { flex: 1; }
    @media (max-width: 730px) { .layout { grid-template-columns: 1fr; } aside { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } aside .field:last-of-type { grid-column: span 2; } .top { align-items: start; } #messages { max-height: 58vh; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><h1>Streaming LLM Chat</h1><p class="sub">FastAPI · Ollama · Server-Sent Events · SQLite</p></div>
      <span class="tag"><span class="dot"></span> Local model · No API key</span>
    </header>
    <div class="layout">
      <aside>
        <div class="field"><label for="model">Ollama model</label><input id="model" value="qwen2.5:0.5b" autocomplete="off"><p class="help">Must already be pulled in Ollama.</p></div>
        <div class="field"><label for="temperature">Temperature (0–2)</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></div>
        <div class="field"><label for="prompt">System prompt</label><textarea id="prompt">You are a concise, helpful assistant.</textarea></div>
        <div class="actions"><button class="secondary" id="newChat" type="button">New chat</button><button class="secondary" id="reload" type="button">Reload</button></div>
      </aside>
      <main>
        <div class="session" id="sessionLabel" aria-label="Session identifier"></div>
        <section id="messages" aria-live="polite"><div class="empty">Start a conversation. Tokens will appear as they arrive.</div></section>
        <div class="status" id="status" role="status">Ready</div>
        <form id="composerForm">
          <div class="composer"><label for="message" class="sr-only">Your message</label><textarea id="message" required placeholder="Ask your model anything..." rows="2" maxlength="20000"></textarea></div>
          <button type="submit" id="send">Send</button>
          <button class="secondary" type="button" id="stop" disabled>Stop</button>
        </form>
      </main>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const historyEl = $('messages');
  let sessionId = localStorage.getItem('llm-session-id') || crypto.randomUUID();
  let currentController = null;
  const setSession = (id) => { sessionId = id; localStorage.setItem('llm-session-id', id); $('sessionLabel').textContent = `Session ID: ${id}`; };
  const setStatus = (message, isError = false) => { $('status').textContent = message; $('status').classList.toggle('error', isError); };
  const setBusy = (busy) => { $('send').disabled = busy; $('stop').disabled = !busy; $('newChat').disabled = busy; $('reload').disabled = busy; };
  const addBubble = (role, text) => {
    if (historyEl.querySelector('.empty')) historyEl.replaceChildren();
    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;
    historyEl.appendChild(bubble);
    historyEl.scrollTop = historyEl.scrollHeight;
    return bubble;
  };
  async function loadHistory() {
    try {
      const response = await fetch(`/sessions/${encodeURIComponent(sessionId)}/messages`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      historyEl.replaceChildren();
      for (const message of data.messages) addBubble(message.role, message.content);
      if (!data.messages.length) historyEl.innerHTML = '<div class="empty">Start a conversation. Tokens will appear as they arrive.</div>';
      setStatus(`Loaded ${data.messages.length} messages`);
    } catch (error) { setStatus(`Could not load history: ${error.message}`, true); }
  }
  function parseSSE(frame) {
    let event = 'message';
    const data = [];
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      if (line.startsWith('data:')) data.push(line.slice(5).trimStart());
    }
    if (!data.length) return null;
    return { event, payload: JSON.parse(data.join('\n')) };
  }
  async function sendMessage(message) {
    setBusy(true);
    setStatus('Connecting to Ollama...');
    addBubble('user', message);
    const bubble = addBubble('assistant', '');
    const controller = new AbortController();
    currentController = controller;
    let finished = false;
    let chars = 0;
    try {
      const response = await fetch('/chat/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
        body: JSON.stringify({
          session_id: sessionId, message, model: $('model').value.trim(),
          temperature: Number($('temperature').value), system_prompt: $('prompt').value
        })
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`HTTP ${response.status}: ${detail.slice(0, 180)}`);
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const consume = (frame) => {
        const item = parseSSE(frame);
        if (!item) return;
        const {event, payload} = item;
        if (event === 'start') { setSession(payload.session_id); setStatus(`Generating with ${payload.model}...`); }
        else if (event === 'token') { bubble.textContent += payload.text; chars += payload.text.length; historyEl.scrollTop = historyEl.scrollHeight; }
        else if (event === 'done') {
          finished = true;
          const u = payload.usage;
          setStatus(`${u.prompt_tokens} input tokens · ${u.completion_tokens} output tokens · $${u.estimated_cost_usd.toFixed(6)} estimated API cost`);
        } else if (event === 'error') { throw new Error(`${payload.code}: ${payload.message}`); }
      };
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true}).replace(/\r\n/g, '\n');
        let pos;
        while ((pos = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, pos);
          buffer = buffer.slice(pos + 2);
          consume(frame);
        }
      }
      if (!finished) throw new Error('Connection ended without a completion event');
    } catch (error) {
      if (error.name === 'AbortError') setStatus('Stopped. Partial response was not saved.');
      else setStatus(error.message, true);
      if (!chars) bubble.textContent = '[No response saved]';
    } finally { currentController = null; setBusy(false); $('message').focus(); }
  }
  $('composerForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const message = $('message').value.trim();
    const temperature = Number($('temperature').value);
    if (!message || !Number.isFinite(temperature) || temperature < 0 || temperature > 2 || !$('model').value.trim()) {
      setStatus('Enter a message, model name, and a temperature between 0 and 2.', true); return;
    }
    $('message').value = '';
    void sendMessage(message);
  });
  $('message').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); if (!$('send').disabled) $('composerForm').requestSubmit(); }
  });
  $('stop').addEventListener('click', () => currentController?.abort());
  $('newChat').addEventListener('click', () => { setSession(crypto.randomUUID()); historyEl.innerHTML = '<div class="empty">New conversation. Send a message to begin.</div>'; setStatus('New session ready'); });
  $('reload').addEventListener('click', () => void loadHistory());
  setSession(sessionId);
  void (async () => {
    try {
      const response = await fetch('/config');
      if (response.ok) {
        const config = await response.json();
        $('model').value = config.model;
        $('temperature').value = config.temperature;
        $('prompt').value = config.system_prompt;
      }
    } catch (_) { /* Retain sensible form defaults when config is unavailable. */ }
    await loadHistory();
  })();
</script>
</body>
</html>
